"Status of the payment of a signup, for the Pix / payment link step. Public: no personal data."
type SignupPaymentStatus {
  signup_id: ID!
  "PEDING_PAYMENT | CONFIRMED | EXPIRED | CANCELED | REFUND (an Opa Pingou charge past expires_at shows as EXPIRED)."
  status: String!
  "opapingou; null on old Pix Aí payments."
  provider: String
  "PIX_QR | PAYMENT_LINK"
  kind: String
  expires_at: String
  confirmed_at: String
  pix_br_code: String
  payment_link: String
  "Cents."
  value: Float
  refund_support: RefundSupport
}

"Refund is manual, through support on WhatsApp. Without a number configured, whatsapp is null."
type RefundSupport {
  text: String
  whatsapp: String
}

type EventPaymentSettings {
  "Always opapingou, the only provider (REA-15)."
  payment_provider: String
}

type EventPayment {
  email: String!
  name: String
  status: String!
  "Cents."
  value: Float
  expires_at: String
  "Approved by an admin without a charge (REA-34): CONFIRMED, but counts as R$ 0 and out of the revenue."
  manual_approved: Boolean
  manual_approved_at: String
  "Name (or e-mail) of the admin who approved it."
  manual_approved_by: String
}

"Whether a signup can be approved without a charge (REA-34)."
type SignupApprovalPreview {
  approvable: Boolean!
  "NOT_FOUND | NO_PAYMENT | ALREADY_CONFIRMED | REFUNDED | ALREADY_APPROVED; null when approvable."
  reason: String
  "The payment status (PEDING_PAYMENT | CONFIRMED | EXPIRED | CANCELED | REFUND); null without payment."
  status: String
  "BATCH_FULL | EVENT_FULL | COUPON_EXHAUSTED: the approval goes over that limit (it is still allowed)."
  warnings: [String!]!
}

type ApproveSignupResult {
  success: Boolean!
  "For the admin, in Portuguese."
  message: String
  "It was already approved: nothing changed and no e-mail was sent."
  already_approved: Boolean
  warnings: [String!]!
  "The \"Inscrição confirmada\" e-mail with the ticket went out."
  email_sent: Boolean
}

extend type Query {
  "Null when the signup does not exist or has no payment."
  signupPaymentStatus(signupId: ID!): SignupPaymentStatus
  "Admin only. eventId: the Hub id (uuid) or the slug. Always opapingou now; kept for the frontend in production."
  eventPaymentSettings(eventId: ID!): EventPaymentSettings @deprecated(reason: "Opa Pingou is the only provider.")
  "Admin only."
  eventPayments(slugOrId: String!): [EventPayment!]!
  "Admin only (REA-34). event: slug or Hub id; signup_id: the SignupEntry.signup_id."
  signupApprovalPreview(event: String!, signup_id: ID!): SignupApprovalPreview!
}

extend type Mutation {
  "Admin only (REA-34). Confirms a pending, expired or canceled signup without a charge and e-mails the ticket."
  approveSignupManually(event: String!, signup_id: ID!): ApproveSignupResult!
}
