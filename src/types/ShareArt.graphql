# REA-43 — arte "eu vou" personalizada por evento.
# A área da foto é guardada em frações da imagem de fundo (0 a 1), não em pixels.

"Where the participant's photo goes, in fractions of the background (0 to 1)."
type ShareArtPhotoArea {
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  "0 = square corners, 1 = circle (when the area is square): radius × half of the smaller side."
  radius: Float!
}

"REA-47: fonts the art draws."
enum ShareArtFont {
  inter
  inter_bold
  serif
  serif_bold
  dancing_script
  great_vibes
  allura
}

enum ShareArtAlign {
  left
  center
  right
}

"REA-47: where a text goes — the name the person typed or the role they picked in the generator — in fractions of the background, and its style."
type ShareArtText {
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  font: ShareArtFont!
  "Font size as a fraction of the image width (0.05 → 54px on 1080px); the text shrinks to fit the area."
  size: Float!
  "#rrggbb"
  color: String!
  align: ShareArtAlign!
}

"One format of the art; only returned when it has both a background and a photo area."
type ShareArtFormatConfig {
  background: String!   # URL absoluta
  background_id: String!
  background_width: Int
  background_height: Int
  photo_area: ShareArtPhotoArea!
  "Null: the name is not on the art."
  name_text: ShareArtText
  "Null: the role is not on the art."
  role_text: ShareArtText
}

type ShareArtConfig {
  id: String
  "Stories, 9:16. Null → the participant gets the default art in this format."
  story: ShareArtFormatConfig
  "Feed, 4:5 (1080×1350; it was 1:1 before REA-47). Null → the participant gets the default art in this format."
  feed: ShareArtFormatConfig
  "Formats whose saved background is in an old ratio (the 1:1 feed, REA-47): they show the default art until a new background is sent."
  retired_formats: [String!]!
}


input ShareArtPhotoAreaInput {
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  radius: Float!
}

input ShareArtTextInput {
  x: Float!
  y: Float!
  width: Float!
  height: Float!
  font: ShareArtFont!
  size: Float!
  color: String!
  align: ShareArtAlign!
}

input ShareArtFormatInput {
  "Media id of the background (from the upload)."
  background: String!
  photo_area: ShareArtPhotoAreaInput!
  "Left out: kept as it is. Null: the name leaves the art."
  name_text: ShareArtTextInput
  "Left out: kept as it is. Null: the role leaves the art."
  role_text: ShareArtTextInput
}



"A format left out is kept as it is; a format sent as null goes back to the default art."
input ShareArtConfigInput {
  story: ShareArtFormatInput
  feed: ShareArtFormatInput
}

type Query {
  "Public: the participant's art page reads it. eventId is the slug or the documentId."
  shareArtConfig(eventId: String!): ShareArtConfig
}

type Mutation {
  "Admin or organizer of the event."
  upsertShareArtConfig(eventId: String!, data: ShareArtConfigInput!): ShareArtConfig
}
