scalar JSON

type Event {
  id: String
  title: String
  description: JSON
  start_date: String
  end_date: String
  images: [String]
  talks: [Talk]
  communities: [Community]
  location: Location
  tags: [Tag]
  comments: [Comment]
  createdAt: String
  updatedAt: String
  documentId: String
  subscription_link: String
  slug: String
  uuid: String
  max_slots: Int
  products: [Product]
  is_online: Boolean
  call_link: String
  "Hidden from the public listings; still reachable by its direct link."
  unlisted: Boolean
}

type Query {
  events(
    filters: EventFilter
    sort: [EventSort]
    pagination: PaginationInput
    search: String
    "Admin listings pass true to also get the unlisted events."
    include_unlisted: Boolean
  ): PaginatedEvents

  event(id: String!): Event

  eventBySlugOrId(slugOrId: String!): Event

  isUserSignedUp(eventId: String!, email: String!): IsSignedUpResponse

  # Legacy query for backward compatibility
  findEvents: [Event]
}

input EventInput {
  title: String!
  description: JSON
  start_date: String!
  end_date: String!
  max_slots: Int
  slug: String
  uuid: String
  "Ignored: the Pix Aí no longer exists (REA-15). Accepted until the frontend stops sending it."
  pixai_token_integration: String @deprecated(reason: "Pix Aí removed; ignored.")
  "Ignored: the Pix Aí no longer exists (REA-15). Accepted until the frontend stops sending it."
  pixai_token_integration_id: String @deprecated(reason: "Pix Aí removed; ignored.")
  is_online: Boolean
  call_link: String
  unlisted: Boolean
  location: String
  images: [String]
  communities: [String]
  talks: [String]
}

input BatchSaleInput {
  id: String
  batch_number: Int
  value: Float
  max_quantity: Int
  valid_from: String
  valid_until: String
  enabled: Boolean
  half_price_eligible: Boolean
}

input ProductSaleInput {
  id: String
  name: String
  enabled: Boolean
  batches: [BatchSaleInput]
}

input EventSaleInput {
  max_slots: Int
  products: [ProductSaleInput]
  "Ignored: the Opa Pingou charges every paid batch (REA-15). Accepted until the frontend stops sending it."
  payment_provider: String @deprecated(reason: "Opa Pingou is the only provider; ignored.")
}

type Mutation {
  submitEventComment(eventId: String!): Comment
  createEvent(data: EventInput!): Event
  updateEvent(id: String!, data: EventInput!): Event
  updateEventSale(id: String!, data: EventSaleInput!): Event
  deleteEvent(id: String!): Event
  signupToEvent(
    eventId: String!
    name: String!
    email: String!
    batch_id: String!
    coupon_code: String
    is_student: Boolean
    phone_number: String
    t_shirt_size: String
    "Required by the Eventando for every new signup; validated there, never returned."
    cpf: String
    "PIX_QR | PAYMENT_LINK (Opa Pingou). Calling again with the other kind on a pending signup is a new attempt."
    kind: String
  ): SignupResponse
}

type SignupResponse {
  success: Boolean
  message: String
  payment: JSON
  is_free: Boolean
  "Id of the created signup (EventSignup.id) — the kiosk reads it from the ticket QR."
  signup_id: String
  "REA-22, signup without login: NEW_ACCOUNT | EXISTING_ACCOUNT | CPF_OWNER | ALREADY_SIGNED_UP. Null when signed in."
  outcome: String
  "REA-22: where the confirmation went — the e-mail typed, or another account's masked (glad****@***ail.com)."
  confirmation_sent_to: String
}

type Subscription {
  commentEventAdded: Comment
}

type IsSignedUpResponse {
  is_signed_up: Boolean!
  call_link: String
  "Id of the signup (EventSignup.id), so the page can render the ticket QR."
  signup_id: String
}

# Event filters
input EventFilter {
  id: StringFilter
  documentId: StringFilter
  title: StringFilter
  slug: StringFilter
  start_date: DateFilter
  end_date: DateFilter
  createdAt: DateFilter
  updatedAt: DateFilter
  community: CommunityFilter
  location: LocationFilter
  tags: TagFilter
  and: [EventFilter]
  or: [EventFilter]
}

# Event sort
input EventSort {
  id: SortOrder
  title: SortOrder
  start_date: SortOrder
  end_date: SortOrder
  createdAt: SortOrder
  updatedAt: SortOrder
}

# Paginated Event response
type PaginatedEvents {
  data: [Event]
  meta: PaginationInfo
}
