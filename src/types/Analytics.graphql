# Event Analytics types — aggregated data for admin dashboards

type EventAnalytics {
  event_id: String!
  event_title: String!
  event_slug: String

  # Core signup metrics
  total_signups: Int!
  free_signups: Int!
  paid_signups: Int!

  # Capacity
  max_slots: Int
  occupancy_percentage: Float

  # Certificate requests (Hub Community Manager participants)
  certificate_requests: Int!

  # Product/Batch breakdown
  products_breakdown: [ProductAnalytics]

  # Signup timeline (daily aggregation)
  signups_timeline: [TimelineDataPoint]

  # Full signups list
  all_signups: [SignupEntry]

  # Check-in
  checked_in_count: Int!
  "Check-ins over signups, in percent; null without signups."
  attendance_rate: Float
  "Signups created on an event day (São Paulo time, start_date through end_date)."
  day_of_signups: Int!
  day_of_signups_by_origin: [OriginCount!]!
  signups_by_origin: [OriginBreakdown!]!
  "Check-ins per São Paulo hour; date is \"YYYY-MM-DDTHH:00\"."
  checkins_timeline: [TimelineDataPoint!]!
}

"SITE: public signup (site or ticket QR). MANUAL: admin manual signup. IMPORT: spreadsheet import."
enum SignupOrigin {
  SITE
  MANUAL
  IMPORT
}

type OriginCount {
  origin: SignupOrigin!
  count: Int!
}

type OriginBreakdown {
  origin: SignupOrigin!
  total: Int!
  checked_in: Int!
}

type ProductAnalytics {
  product_id: String
  product_name: String!
  total_signups: Int!
  batches: [BatchAnalytics]
}

type BatchAnalytics {
  batch_id: String
  batch_number: Int
  value: Float
  max_quantity: Int
  sold_quantity: Int!
  revenue: Float!
}

type TimelineDataPoint {
  date: String!
  count: Int!
}

type SignupEntry {
  name: String
  email: String
  phone_number: String
  created_at: String
  product_name: String
  checked_in: Boolean
  checked_in_at: String
  origin: SignupOrigin
  "Digits only; from the account, or the Startup Weekend form."
  cpf: String
}

type Query {
  eventAnalytics(slugOrId: String!): EventAnalytics
}
