# Checkin types — credentialing system for event check-in

type EventSignup {
  id: String!
  name: String!
  email: String
  phone_number: String
  checked_in: Boolean
  checked_in_at: String
  product_name: String
}

type CheckinResponse {
  success: Boolean!
  message: String
  signup: EventSignup
}

input SignupImportInput {
  name: String!
  email: String
  phone_number: String
  "Saved on the HubCommunity account when it has none — also for signups that already existed."
  cpf: String
}

type ImportSignupsResponse {
  success: Boolean!
  message: String
  imported_count: Int!
  skipped_count: Int!
  errors: [String]
}

type Query {
  eventSignups(eventSlug: String!, search: String): [EventSignup]
}

input SignupUpdateInput {
  name: String
  email: String
  phone_number: String
}

input ManualSignupInput {
  name: String!
  email: String!
  cpf: String
  phone_number: String
}

type ManualSignupResponse {
  success: Boolean!
  message: String
  account_created: Boolean
  "The signup (created or pre-existing), so the caller can print a badge right away."
  signup: EventSignup
}

type BulkEmailResponse {
  success: Boolean!
  message: String
  "How many e-mails were queued; they are sent in the background after the response."
  queued_count: Int!
}

input CpfMappingInput {
  email: String!
  cpf: String!
  "Used only when the e-mail has no account yet and one is created."
  name: String
}

"""
SAVED: CPF written on the account. CREATED: account created (no e-mail sent) and CPF written.
UNCHANGED: the account already had this CPF. DIFFERENT: the account has another CPF — not overwritten.
INVALID: missing e-mail or not an 11-digit CPF. CONFLICT: the same e-mail came with two CPFs.
FAILED: the manager call failed.
"""
enum CpfMappingStatus {
  SAVED
  CREATED
  UNCHANGED
  DIFFERENT
  INVALID
  CONFLICT
  FAILED
}

type CpfMappingItem {
  email: String!
  cpf: String!
  status: CpfMappingStatus!
  "Why a FAILED row failed (step and message)."
  detail: String
}

type CpfMappingResult {
  saved: Int!
  created: Int!
  unchanged: Int!
  different: Int!
  skipped: Int!
  failed: Int!
  "One per row sent, in the same order."
  items: [CpfMappingItem!]!
}

type Mutation {
  "E-mail → CPF from a spreadsheet onto HubCommunity accounts; never overwrites a CPF an account already has."
  updateCpfs(rows: [CpfMappingInput!]!): CpfMappingResult
  "checkedInAt: when the device did the check-in (ISO); defaults to now. Already checked-in signups are returned unchanged."
  checkinSignup(eventSlug: String!, signupId: String!, checkedInAt: String): CheckinResponse
  importSignups(eventSlug: String!, batchId: String!, signups: [SignupImportInput!]!): ImportSignupsResponse
  manualSignup(eventSlug: String!, batchId: String!, input: ManualSignupInput!): ManualSignupResponse
  "Corrects an existing signup — a typo in the name, e-mail or phone. Only the fields sent change; the rest, including the check-in, is left alone."
  updateSignup(eventSlug: String!, signupId: String!, input: SignupUpdateInput!): CheckinResponse
  "Re-sends the signup confirmation (ticket QR + set-password link) to every imported signup of the event that has an e-mail. A pending account gets a new link; the previous one stops working."
  sendImportedSignupConfirmations(eventSlug: String!): BulkEmailResponse
}

type Subscription {
  credentialCheckedIn(eventSlug: String!): EventSignup
}
