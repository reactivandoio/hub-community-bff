# User type
type User {
  id: String
  username: String
  email: String
  name: String
  phone: String
  cpf: String
  date_of_birth: String
  "REA-36: the account declared being 18 or more (checkbox of a signup form)."
  adult_declaration: Boolean
  adult_declaration_at: String
  cover_photo: String
  twitter: String
  linkedin: String
  github: String
  website: String
  instagram: String
  role: String
  communities: [Community]
  speaker: Speaker
  agenda: [Agenda]
  createdAt: String
  updatedAt: String
  token: String
}

# User filters
input UserFilter {
  id: StringFilter
  documentId: StringFilter
  username: StringFilter
  email: StringFilter
  role: StringFilter
  createdAt: DateFilter
  updatedAt: DateFilter
  and: [UserFilter]
  or: [UserFilter]
}

# User sort
input UserSort {
  id: SortOrder
  username: SortOrder
  email: SortOrder
  role: SortOrder
  createdAt: SortOrder
  updatedAt: SortOrder
}

# Paginated User response
type PaginatedUsers {
  data: [User]
  meta: PaginationInfo
}

# User queries
extend type Query {
  users(
    filters: UserFilter
    sort: [UserSort]
    pagination: PaginationInput
    search: String
  ): PaginatedUsers

  user(id: String!): User
  userByUsername(username: String!): User
  me: User
}

# Profile update input
input ProfileInput {
  name: String
  phone: String
  cpf: String
  "YYYY-MM-DD; must be of someone aged 18 or more (REA-36)."
  date_of_birth: String
  "Checkbox 'Declaro que tenho 18 anos ou mais' (REA-36). Required with date_of_birth while the account has not declared it."
  adult_declaration: Boolean
  "Checkbox 'quero receber novidades' of the complete-profile form (REA-29/REA-26). Only true is recorded; false is ignored, so an opt-in is never taken back here."
  marketing_opt_in: Boolean
  avatar: String
  cover_photo: String
  twitter: String
  linkedin: String
  github: String
  website: String
  instagram: String
}

# REA-26: the login is only by a code sent to the e-mail (no password).
type LoginCodeRequest {
  "Always true when it answers: the same answer whether the account exists or not."
  sent: Boolean!
  "Seconds before another code can be asked for."
  resendIn: Int!
}

extend type Mutation {
  "E-mails a 6-digit code, valid for 10 minutes. Errors: LOGIN_CODE_COOLDOWN (retryAfter), LOGIN_CODE_LIMIT, LOGIN_CODE_NOT_SENT (retryAfter), RATE_LIMITED."
  requestLoginCode(email: String!): LoginCodeRequest!
  "Checks the code and returns the user with its session token; an unknown e-mail gets its account now. Errors: LOGIN_CODE_INVALID (attemptsLeft), LOGIN_CODE_EXPIRED, ACCOUNT_BLOCKED, RATE_LIMITED."
  verifyLoginCode(email: String!, code: String!): User!
  updateUserPhone(email: String!, phone: String!): User
  updateProfile(input: ProfileInput!): User
}

# Pagination input
input PaginationInput {
  page: Int = 1
  pageSize: Int = 25
}
