# Certificate types — certificado de participação

type CertificateConfig {
  id: String
  enabled: Boolean!
  allow_self_request: Boolean!
  title: String
  body_template: String
  workload_hours: Float
  issuer_name: String
  primary_color: String
  logo: String        # URL absoluta
  logo_id: String     # id de mídia no Strapi (para re-salvar sem novo upload)
  background: String
  background_id: String
  sponsors: [Sponsor!]!
  signatures: [Signature!]!
}

type Sponsor {
  name: String!
  logo: String
  logo_id: String
  url: String
}

enum SignatureFont {
  great_vibes
  allura
  dancing_script
}

type Signature {
  name: String!
  role: String
  image: String
  image_id: String
  text: String
  font: SignatureFont
}

enum CertificateSource {
  ATTENDANCE
  SELF_REQUEST
  ADMIN
}

type Certificate {
  id: String
  code: String!
  name: String!
  identifier: String   # CPF (11 dígitos) ou e-mail normalizado; null em certificateByCode
  email: String        # null em certificateByCode
  source: CertificateSource!
  category: String!     # "Participante" (padrão), "Organizador", "Mentor"...
  issued_at: String
  sent_at: String
  revoked_at: String
  event: Event
}

type LookupResult {
  certificate: Certificate
  eligible_by_attendance: Boolean!
  self_request_allowed: Boolean!
  event_ended: Boolean!
  revoked: Boolean!
}

input SponsorInput {
  name: String!
  logo: String!
  url: String
}

input SignatureInput {
  name: String!
  role: String
  image: String
  text: String
  font: SignatureFont
}

input CertificateConfigInput {
  enabled: Boolean
  allow_self_request: Boolean
  title: String
  body_template: String
  workload_hours: Float
  issuer_name: String
  primary_color: String
  logo: String
  background: String
  sponsors: [SponsorInput!]
  signatures: [SignatureInput!]
}

"A certificate model together with the event it belongs to."
type CertificateConfigSummary {
  event: CertificateConfigEvent!
  config: CertificateConfig!
}

type CertificateConfigEvent {
  id: String!
  slug: String
  title: String!
  start_date: String
}

type Query {
  certificateConfig(eventId: String!): CertificateConfig
  "Every certificate model (admin): the source list for copying a model between events."
  certificateConfigs: [CertificateConfigSummary!]!
  certificateByCode(code: String!): Certificate
  lookupCertificate(eventId: String!, identifier: String!): LookupResult!
}

type Mutation {
  upsertCertificateConfig(eventId: String!, data: CertificateConfigInput!): CertificateConfig
  copyCertificateConfig(fromEventId: String!, toEventId: String!): CertificateConfig
  requestCertificate(
    eventId: String!
    name: String!
    identifier: String!
    email: String!
    phone: String
  ): Certificate
}

enum CandidateSource {
  SIGNUP
  ATTENDANCE
  REQUEST
}

type CertificateCandidate {
  key: String!
  name: String!
  email: String
  identifier: String
  phone: String
  "Só quem preencheu um formulário de solicitação informa — \"YYYY-MM-DD\"."
  date_of_birth: String
  sources: [CandidateSource!]!
  checked_in: Boolean
  certificate: Certificate
}

"Formulário público de solicitação de certificado, de uma categoria de um evento."
type CertificateRequestForm {
  id: String!
  title: String!
  category: String!
  slug: String!
  description: String
  enabled: Boolean!
  "Quantas pessoas já solicitaram por este formulário."
  submissions: Int!
}

"O que a página pública do formulário precisa saber. Nunca expõe quem já solicitou."
type CertificateRequestFormPage {
  title: String!
  category: String!
  description: String
  enabled: Boolean!
  event: CertificateConfigEvent!
}

input CertificateRequestFormInput {
  title: String!
  category: String!
  description: String
  enabled: Boolean
}

type CertificateRequestReceipt {
  ok: Boolean!
  category: String!
  event_title: String!
}

input IssueEntryInput {
  name: String!
  identifier: String   # CPF opcional; sem CPF válido o e-mail normalizado vira o identificador
  email: String!
}

input IssueActionsInput {
  register: Boolean!
  email: Boolean!
}

type IssueResult {
  issued: Int!
  emailed: Int!
  certificates: [Certificate!]!
  errors: [String!]!
}

extend type Query {
  "A lista de uma categoria. Sem `category`, a de participantes: inscritos, presenças e solicitações."
  certificateCandidates(eventId: String!, category: String): [CertificateCandidate!]!
  "Os formulários de solicitação do evento (admin)."
  certificateRequestForms(eventId: String!): [CertificateRequestForm!]!
  "O formulário público, pelo slug do link."
  certificateRequestForm(slug: String!): CertificateRequestFormPage
}

extend type Mutation {
  issueCertificates(
    eventId: String!
    entries: [IssueEntryInput!]!
    actions: IssueActionsInput!
    category: String
  ): IssueResult!
  createCertificateRequestForm(eventId: String!, data: CertificateRequestFormInput!): CertificateRequestForm!
  updateCertificateRequestForm(id: String!, data: CertificateRequestFormInput!): CertificateRequestForm!
  deleteCertificateRequestForm(id: String!): Boolean!
  "Envio público do formulário: entra na lista da categoria, para a organização emitir depois."
  submitCertificateRequest(
    slug: String!
    name: String!
    identifier: String!
    email: String!
    phone: String!
    "\"YYYY-MM-DD\". Opcional no schema para não quebrar um front antigo em deploy."
    date_of_birth: String
  ): CertificateRequestReceipt!
}
