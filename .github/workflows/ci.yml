name: CI

# Roda em runner do GitHub (nunca no thor): instala, lint (não bloqueia), testes e build.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma versão do ambiente Docker de desenvolvimento e da produção (REA-21).
          node-version-file: .nvmrc
          cache: yarn

      - name: Instalar dependências
        run: yarn install --frozen-lockfile --network-timeout 600000

      # Dívida antiga de lint; fica visível sem bloquear.
      - name: Lint (não bloqueia)
        continue-on-error: true
        run: yarn eslint src

      - name: Testes
        run: yarn test

      - name: Testes dos scripts de deploy
        run: bash .github/scripts/env-scripts.test.sh

      - name: Build
        run: yarn build

  # O ambiente de desenvolvimento (Dockerfile.dev) monta com a versão do .nvmrc.
  docker-dev:
    name: docker-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imagem de desenvolvimento usa o Node do .nvmrc
        run: |
          docker build -q -f Dockerfile.dev --build-arg NODE_VERSION="$(cat .nvmrc)" -t dev-check .
          test "$(docker run --rm dev-check node -v)" = "v$(cat .nvmrc)"
